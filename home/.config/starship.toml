"$schema" = 'https://starship.rs/config-schema.json'
format = """
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$pixi\
$cmd_duration\
$line_break$character"""
palette = 'colors'

[palettes.colors]
# 高对比度文字颜色（在透明背景下清晰可见）
color_text_primary = '#dee4df'      # 主要文字
color_text_error = '#ffb4ab'             # 错误/警告文字
color_text_success = '#a8cbe2'        # 成功文字

# 强调色（用于特殊元素）
color_accent_blue = '#88d6bb'          # 蓝色强调
color_accent_yellow = '#b2ccc1'      # 黄色强调
color_accent_purple = '#284b5d' # 紫色强调
color_accent_aqua = '#344c43'  # 青色强调

# 向后兼容的别名
color_green = '#a8cbe2'               # 绿色（成功）
color_red = '#ffb4ab'                    # 红色（错误）
color_blue = '#88d6bb'                 # 蓝色
color_yellow = '#b2ccc1'             # 黄色
color_aqua = '#344c43'     # 青色
color_purple = '#284b5d'    # 紫色

[os]
disabled = true

[username]
disabled = true

[directory]
style = "fg:color_accent_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:color_accent_aqua"
format = '[[ $symbol $branch ](fg:color_text_primary)]($style)'

[git_status]
style = "fg:color_accent_aqua"
format = '[[($all_status$ahead_behind )](fg:color_text_primary)]($style)'

[nodejs]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[c]
symbol = " "
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[cpp]
symbol = " "
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[rust]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[golang]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[php]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[java]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[kotlin]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[haskell]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[python]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[docker_context]
symbol = ""
style = "fg:color_accent_aqua"
format = '[[ $symbol( $context) ](fg:color_text_primary)]($style)'

[conda]
style = "fg:color_accent_aqua"
format = '[[ $symbol( $environment) ](fg:color_text_primary)]($style)'

[pixi]
style = "fg:color_accent_aqua"
format = '[[ $symbol( $version)( $environment) ](fg:color_text_primary)]($style)'

[time]
disabled = true

[cmd_duration]
format = "[$duration]($style) "
style = "fg:color_accent_yellow"
min_time = 1000  # 只显示超过1秒的命令

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[>](bold fg:color_text_success)'
error_symbol = '[>](bold fg:color_text_error)'
vimcmd_symbol = '[>](bold fg:color_text_success)'
vimcmd_replace_one_symbol = '[>](bold fg:color_accent_purple)'
vimcmd_replace_symbol = '[>](bold fg:color_accent_purple)'
vimcmd_visual_symbol = '[>](bold fg:color_accent_yellow)'