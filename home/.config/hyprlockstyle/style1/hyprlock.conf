source = colors.conf
# 如果你没有 colors.conf，可以注释掉上面这一行，并手动修改下面用到 $primary 的地方

$font = JetBrains Mono Nerd Font # 建议使用 Nerd Font，如果没有，改回 Monospace
$text_color = rgba(242, 243, 244, 0.75)
$entry_background_color = rgba(12, 12, 12, 0.7)
$entry_border_color = rgba(90, 90, 90, 0.9)
$entry_color = rgba(242, 243, 244, 0.87)

general {
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2 # 模糊强度，3有点太糊了，2比较适中，根据喜好调整
    blur_size = 5
    noise = 0.0117
    contrast = 1.3000 # 增加对比度，让字更清晰
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.64 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    fade_on_empty = true
    placeholder_text = <i>Password...</i> # 提示文字
    hide_input = false
    position = 0, 50  # 位置调整：在屏幕中心偏下一点
    halign = center
    valign = bottom
}

# TIME - 巨大的时间显示
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 90
    font_family = $font
    color = $text_color
    
    # 添加阴影以适应浅色壁纸
    shadow_passes = 1
    shadow_size = 4
    shadow_boost = 1.0
    shadow_color = rgba(0, 0, 0, 0.8)

    position = 0, 60
    halign = center
    valign = center
}

# DATE - 日期显示
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    font_size = 22
    font_family = $font
    color = $text_color
    
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)

    position = 0, -15
    halign = center
    valign = center
}

# USER GREETING - 问候语 (例如: Hi, root)
label {
    monitor =
    text = Hi, $USER
    font_size = 14
    font_family = $font
    color = $text_color
    
    position = 0, -50
    halign = center
    valign = center
}

# KEYBOARD LAYOUT - 键盘布局 (放到了最底下，不干扰视觉)
label {
    monitor =
    text = Layout: $LAYOUT
    font_size = 10
    font_family = $font
    color = rgba(200, 200, 200, 0.5)

    position = 0, 10
    halign = center
    valign = bottom
}
