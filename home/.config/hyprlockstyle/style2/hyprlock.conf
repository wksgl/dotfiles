# 1. 引入 Matugen 生成的颜色文件
source = ~/.config/hypr/colors.conf

$font = JetBrains Mono Nerd Font

general {
    hide_cursor = true
    grace = 5
    disable_loading_bar = true
    screencopy_mode = 1
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 5
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.8000
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.64
    dots_center = true
    
    # --- 动态颜色配置开始 ---
    # 外边框：使用 Primary 颜色，完全不透明 (ff)
    outer_color = rgba($primaryff)
    
    # 内部背景：使用 Surface Container 颜色，带一点透明度 (cc -> ~80%)
    inner_color = rgba($surface_containercc)
    
    # 字体颜色：使用 On Surface 颜色
    font_color = rgba($on_surfaceff)
    
    # 检查密码时的颜色：使用 Secondary 颜色
    check_color = rgba($secondaryff)
    
    # 错误时的颜色：使用 Error 颜色
    fail_color = rgba($errorff)
    # --- 动态颜色配置结束 ---

    fade_on_empty = false
    placeholder_text = <span foreground="##$on_surface" alpha="25%"><i>Password</i></span>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 90
    font_family = $font
    
    # 使用 Primary 颜色，让时间最显眼
    color = rgba($primaryff)
    
    shadow_passes = 1
    shadow_size = 4
    shadow_boost = 1.0
    shadow_color = rgba(0, 0, 0, 0.8)

    position = 0, 100
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    #text = cmd[update:1000] echo "$(date +"%A, %B %d")"
	text = cmd[update:1000] echo "<span font='Source Han Sans CN Bold 22'>$(LC_TIME=zh_CN.UTF-8 date +"%-m月%-d日    %A")</span>"
	
    font_size = 20
    #font_family = $font
    
    # 使用 On Surface 颜色 (通常是黑或白)
    color = rgba($on_surfaceff)
    
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.8)

    position = 0, 10
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    font_size = 14
    font_family = $font
    color = $text_color
    
    position = 0, -50
    halign = center
    valign = center
}

# KEYBOARD LAYOUT - 键盘布局 (放到了最底下，不干扰视觉)
label {
    monitor =
    text = Layout: $LAYOUT
    font_size = 10
    font_family = $font
    color = rgba(200, 200, 200, 0.5)

    position = 0, 10
    halign = center
    valign = bottom
}
