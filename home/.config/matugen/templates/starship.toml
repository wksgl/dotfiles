"$schema" = 'https://starship.rs/config-schema.json'
format = """
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$pixi\
$cmd_duration\
$line_break$character"""
palette = 'colors'

[palettes.colors]
# --- 高对比度文字颜色 ---
# 使用 on_surface 确保在背景上清晰可见
color_text_primary = '{{colors.on_surface.default.hex}}'
# 使用 error 颜色
color_text_error = '{{colors.error.default.hex}}'
# 成功通常用绿色，这里可以用 tertiary 或自定义映射
color_text_success = '{{colors.tertiary.default.hex}}'

# --- 强调色 ---
# Matugen 生成的是 Material Design 颜色 (Primary, Secondary, Tertiary 等)
# 你需要根据喜好把它们映射给你的变量
color_accent_blue = '{{colors.primary.default.hex}}'
color_accent_yellow = '{{colors.secondary.default.hex}}'
color_accent_purple = '{{colors.tertiary.default.hex}}'
color_accent_aqua = '{{colors.primary_container.default.hex}}'

# --- 向后兼容的别名 (复用上面的变量) ---
color_green = '{{colors.tertiary.default.hex}}'
color_red = '{{colors.error.default.hex}}'
color_blue = '{{colors.primary.default.hex}}'
color_yellow = '{{colors.secondary.default.hex}}'
color_aqua = '{{colors.primary_container.default.hex}}'
color_purple = '{{colors.tertiary.default.hex}}'


[os]
disabled = true

[username]
disabled = true

[directory]
style = "fg:color_accent_yellow"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "fg:color_accent_aqua"
format = '[[ $symbol $branch ](fg:color_text_primary)]($style)'

[git_status]
style = "fg:color_accent_aqua"
format = '[[($all_status$ahead_behind )](fg:color_text_primary)]($style)'

[nodejs]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[c]
symbol = " "
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[cpp]
symbol = " "
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[rust]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[golang]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[php]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[java]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[kotlin]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[haskell]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[python]
symbol = ""
style = "fg:color_accent_blue"
format = '[[ $symbol( $version) ](fg:color_text_primary)]($style)'

[docker_context]
symbol = ""
style = "fg:color_accent_aqua"
format = '[[ $symbol( $context) ](fg:color_text_primary)]($style)'

[conda]
style = "fg:color_accent_aqua"
format = '[[ $symbol( $environment) ](fg:color_text_primary)]($style)'

[pixi]
style = "fg:color_accent_aqua"
format = '[[ $symbol( $version)( $environment) ](fg:color_text_primary)]($style)'

[time]
disabled = true

[cmd_duration]
format = "[$duration]($style) "
style = "fg:color_accent_yellow"
min_time = 1000  # 只显示超过1秒的命令

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_text_success)'
error_symbol = '[❯](bold fg:color_text_error)'
vimcmd_symbol = '[❯](bold fg:color_text_success)'
vimcmd_replace_one_symbol = '[❯](bold fg:color_accent_purple)'
vimcmd_replace_symbol = '[❯](bold fg:color_accent_purple)'
vimcmd_visual_symbol = '[❯](bold fg:color_accent_yellow)'
